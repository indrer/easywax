name: AutoWaxSign
version: 1.0.0
main: me.miicro.autowaxsign.AutoWaxSign
description: Waxes signs automatically so others can't edit them
author: miicro
api-version: "1.21.11"
commands:
  waxit:
    description: Waxes the sign that the player punches. Punching any other block cancels the command
    usage: /waxit